# ============================================================================
# Production overrides.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Always-restart policy.
# - MySQL is NOT published to the host (reachable only on the internal network).
# - Provide real secrets via a `.env` file or your orchestrator's secret store,
#   and a strong, stable ENCRYPTION_KEY.
# ============================================================================

services:
  app:
    restart: always
    environment:
      APP_ENV: production

  db:
    restart: always
    # Intentionally no `ports:` mapping — database stays on the internal network.
